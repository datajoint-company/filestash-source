version: '2'
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.debug
      # dockerfile: docker/Dockerfile
      tags:
        - registry.example.org/filestash:latest
      cache_from:
        - type=gha
      cache_to:
        - type=gha
    container_name: filestash
    image: registry.example.org/filestash:0.2.9
    restart: always
    environment:
    - ADMIN_PASSWORD
    - APPLICATION_URL=
    # - CANARY=true
    # - OFFICE_URL=http://wopi_server:9980
    # - OFFICE_FILESTASH_URL=http://app:8334
    # - OFFICE_REWRITE_URL=http://127.0.0.1:9980
    - GDRIVE_CLIENT_ID=<gdrive_client>
    - GDRIVE_CLIENT_SECRET=<gdrive_secret>
    - DROPBOX_CLIENT_ID=<dropbox_key>
    - ONLYOFFICE_URL=http://onlyoffice
    - FS_IFRAME_OVERRIDE=''
    - FS_CUSTOM_CSS
    - FS_UPLOAD_BUTTON
    - FS_REFRESH_AFTER_UPLOAD
    - FS_FILEPAGE_DEFAULT_VIEW
    - FS_UPLOAD_CHUNK_SIZE
    - FS_FILEPAGE_DEFAULT_SORT
    - FS_ZIP_TIMEOUT
    - FS_SHARE_ENABLE
    # s3_oidc plugin
    - FS_S3_OIDC_DEFAULT_ROLE_ARN
    - FS_S3_OIDC_CLIENT_SECRET
    - FS_S3_OIDC_CLIENT_ID='works'
    - FS_S3_OIDC_CLIENT_AUD='workss3'
    - FS_S3_OIDC_TOKEN_ENDPOINT='https://keycloak.example.org/realms/datajoint/protocol/openid-connect/token'
    - FS_S3_OIDC_DEFAULT_BUCKET='example-bucket'
    - FS_S3_OIDC_DEFAULT_REGION='us-east-2'
    - FS_S3_OIDC_SUPPORT_GROUP='datajoint'
    - FS_S3_OIDC_STS_DURATION=3600
    ports:
    - "8334:8334"
    volumes:
    - filestash:/app/data/state/

  wopi_server:
    container_name: filestash_wopi
    image: collabora/code:24.04.10.2.1
    restart: always
    environment:
    - "extra_params=--o:ssl.enable=false"
    - aliasgroup1="https://.*:443"
    command:
    - /bin/bash
    - -c
    - |
         curl -o /usr/share/coolwsd/browser/dist/branding-desktop.css https://gist.githubusercontent.com/mickael-kerjean/bc1f57cd312cf04731d30185cc4e7ba2/raw/d706dcdf23c21441e5af289d871b33defc2770ea/destop.css
         /bin/su -s /bin/bash -c '/start-collabora-online.sh' cool
    user: root
    ports:
    - "9980:9980"

  app-debug:
    extends: app
    profiles: ["debug"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.debug

  app-test:
    extends: app
    profiles: ["test"]
    build:
      target: builder_backend
    command:
      - sh
      - -c
      - |
        go test -v ./server/plugin/plg_backend_s3_oidc
        # go test -v ./server/plugin/...

volumes:
    filestash: {}
